<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出面帳 - 月次出勤集計</title>
<style>
  :root{
    --bg:#14181f;
    --panel:#1c222c;
    --panel2:#232a36;
    --line:#2e3644;
    --text:#e8ecf2;
    --sub:#8a94a6;
    --accent:#e8a33d;
    --accent2:#4d8dff;
    --good:#4caf7d;
    --warn:#e05a5a;
    --night:#7c6bd6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  header{
    padding:16px 18px 10px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:20;
  }
  header h1{
    margin:0 0 2px;
    font-size:19px;
    font-weight:700;
    letter-spacing:.02em;
  }
  header .sub{color:var(--sub); font-size:12px;}
  nav{
    display:flex; gap:2px; margin-top:12px;
    background:var(--panel); border-radius:10px; padding:3px;
  }
  nav button{
    flex:1; padding:9px 4px; border:none; background:transparent; color:var(--sub);
    font-size:13px; border-radius:8px; cursor:pointer; font-weight:600;
  }
  nav button.active{ background:var(--accent); color:#1a1408; }
  main{ padding:14px 14px 90px; max-width:760px; margin:0 auto; }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:12px;
  }
  .row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row.between{ justify-content:space-between; }
  .datebar{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .datebar button{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    width:36px; height:36px; border-radius:9px; font-size:16px; cursor:pointer;
  }
  .datebar .datelabel{
    flex:1; text-align:center; font-size:16px; font-weight:700;
  }
  .datebar .datelabel .dow{ font-size:12px; color:var(--sub); font-weight:500; margin-left:4px;}
  .holiday-toggle{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--sub);
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer;
  }
  .holiday-toggle.on{ color:var(--warn); border-color:var(--warn); }
  .site-search{
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:14px; margin-bottom:10px;
  }
  .cat-label{ font-size:12px; color:var(--sub); margin:14px 2px 6px; font-weight:600; }
  .site-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .site-btn{
    position:relative;
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:11px 10px; text-align:left; cursor:pointer; color:var(--text);
  }
  .site-btn .name{ font-size:13.5px; font-weight:600; line-height:1.3; }
  .site-btn .meta{ font-size:11px; color:var(--sub); margin-top:3px; }
  .site-btn.done{ border-color:var(--good); }
  .site-btn.done::after{
    content:"✓"; position:absolute; top:6px; right:8px; color:var(--good); font-size:13px; font-weight:800;
  }
  .empty{ color:var(--sub); font-size:13px; padding:20px 4px; text-align:center; }
  .worker-list{ display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .chip{
    padding:8px 13px; border-radius:20px; border:1px solid var(--line);
    background:var(--panel2); font-size:13px; cursor:pointer; color:var(--text);
  }
  .chip.on{ background:var(--accent); color:#1a1408; border-color:var(--accent); font-weight:700; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--sub); margin-bottom:5px; }
  .field input[type=number], .field select{
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:14px;
  }
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-top:1px solid var(--line);
  }
  .switch{ position:relative; width:42px; height:24px; }
  .switch input{ display:none; }
  .switch .slider{
    position:absolute; inset:0; background:var(--panel2); border:1px solid var(--line);
    border-radius:14px; transition:.15s; cursor:pointer;
  }
  .switch .slider::before{
    content:""; position:absolute; width:18px; height:18px; left:2px; top:2px;
    background:var(--sub); border-radius:50%; transition:.15s;
  }
  .switch input:checked + .slider{ background:var(--night); border-color:var(--night); }
  .switch input:checked + .slider::before{ transform:translateX(18px); background:#fff; }
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--panel); width:100%; max-width:760px; border-radius:16px 16px 0 0;
    padding:18px 16px 22px; max-height:85vh; overflow-y:auto;
  }
  .modal h3{ margin:0 0 3px; font-size:16px; }
  .modal .modal-sub{ color:var(--sub); font-size:12px; margin-bottom:14px; }
  .btnbar{ display:flex; gap:8px; margin-top:16px; }
  .btn{
    flex:1; padding:12px; border-radius:10px; border:none; font-size:14px; font-weight:700; cursor:pointer;
  }
  .btn.primary{ background:var(--accent); color:#1a1408; }
  .btn.ghost{ background:var(--panel2); color:var(--text); border:1px solid var(--line); }
  .btn.danger{ background:transparent; color:var(--warn); border:1px solid var(--warn); }
  .entry-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .entry-row:last-child{ border-bottom:none; }
  .entry-row .who{ font-weight:600; }
  .entry-row .detail{ color:var(--sub); font-size:12px; }
  .tag{
    display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:6px; margin-left:6px;
  }
  .tag.night{ background:rgba(124,107,214,.25); color:#b7abf2; }
  .tag.ot{ background:rgba(224,90,90,.2); color:#f0a3a3; }
  .tag.holiday{ background:rgba(232,163,61,.2); color:var(--accent); }
  .remove-x{ color:var(--sub); font-size:16px; cursor:pointer; padding:2px 6px; }
  select.plain{
    background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px;
  }
  table.report{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.report th, table.report td{
    padding:8px 6px; border-bottom:1px solid var(--line); text-align:right;
  }
  table.report th:first-child, table.report td:first-child{ text-align:left; }
  table.report th{ color:var(--sub); font-weight:600; font-size:11px; }
  .summary-total{ font-weight:800; color:var(--accent); }
  .section-title{ font-size:15px; font-weight:700; margin:2px 0 10px; }
  .month-nav{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .month-nav .label{ font-size:16px; font-weight:700; flex:1; text-align:center; }
  .month-nav button{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    width:34px; height:34px; border-radius:9px; cursor:pointer;
  }
  .worker-master-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px; background:var(--panel2); border-radius:9px; margin-bottom:8px;
  }
  .worker-master-row .flags{ display:flex; gap:6px; flex-wrap:wrap; }
  .small-flag{ font-size:11px; color:var(--sub); }
  form.inline{ display:flex; gap:8px; margin-bottom:14px; }
  form.inline input{
    flex:1; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:13px;
  }
  .site-config-row{
    background:var(--panel2); border-radius:10px; padding:11px; margin-bottom:8px;
  }
  .site-config-row .top{ display:flex; justify-content:space-between; align-items:center; }
  .site-config-row .rule-desc{ font-size:12px; color:var(--sub); margin-top:4px; }
  .link-btn{ background:none; border:none; color:var(--accent2); font-size:12.5px; cursor:pointer; padding:0; }
  .footer-note{ text-align:center; color:var(--sub); font-size:11px; margin-top:18px; padding:0 20px; line-height:1.6; }
  .radio-grid{ display:flex; gap:8px; flex-wrap:wrap; }
  .radio-opt{
    flex:1; min-width:100px; text-align:center; padding:12px 8px; border-radius:10px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .radio-opt.on{ background:var(--accent2); border-color:var(--accent2); color:#fff; font-weight:700; }
  .pair-slot{ display:flex; gap:8px; margin-bottom:8px; }
  .pair-slot select{ flex:1; }
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
</style>
</head>
<body>

<header>
  <h1>出面帳</h1>
  <div class="sub">現場をタップして入力 → 月末に自動集計</div>
  <nav>
    <button data-tab="entry" class="active">入力</button>
    <button data-tab="report">月次集計</button>
    <button data-tab="sites">現場設定</button>
    <button data-tab="workers">作業員</button>
  </nav>
</header>

<main id="main"></main>

<div id="modal-root"></div>

<script>
/* ===================== ユーティリティ ===================== */
const DOW = ["日","月","火","水","木","金","土"];
const pad2 = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const ym = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
const uid = () => Math.random().toString(36).slice(2,10);

// 2026年の祝日（自動判定の補助。ズレていたら手動トグルで補正できます）
const JP_HOLIDAYS_2026 = new Set([
  "2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20",
  "2026-04-29","2026-05-03","2026-05-04","2026-05-05","2026-05-06",
  "2026-07-20","2026-08-11","2026-09-21","2026-09-22","2026-09-23",
  "2026-10-12","2026-11-03","2026-11-23"
]);
function isHoliday(dateObj, manualOverride){
  if(manualOverride !== undefined) return manualOverride;
  const s = ymd(dateObj);
  const dow = dateObj.getDay();
  return dow===0 || dow===6 || JP_HOLIDAYS_2026.has(s);
}
function isSunOrHoliday(dateObj, manualOverride){
  if(manualOverride !== undefined) return manualOverride;
  const s = ymd(dateObj);
  return dateObj.getDay()===0 || JP_HOLIDAYS_2026.has(s);
}

/* ===================== Supabase接続 ===================== */
const SUPABASE_URL = "https://gebjrhwfaoyjgmysplhb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlYmpyaHdmYW95amdteXNwbGhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTM0MjAsImV4cCI6MjA5NTg2OTQyMH0.uvRUg94EYo5bKCFJFLjf_bEqA4607gToTDje4HjgauA";

async function sb(path, options={}){
  const { method="GET", body, prefer, headers={} } = options;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      "Prefer": prefer || "return=representation",
      ...headers
    },
    body: body!=null ? JSON.stringify(body) : undefined
  });
  if(!res.ok){
    const text = await res.text().catch(()=>"");
    throw new Error(`Supabase ${res.status}: ${text.slice(0,300)}`);
  }
  if(res.status===204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
function reportError(action, e){
  console.error(action, e);
  alert(`${action}に失敗しました。ネットワーク接続を確認してください。\n(${e.message})`);
}

/* ===================== アプリ状態 ===================== */
let state = {
  tab:"entry",
  currentDate: new Date(),
  reportMonth: ym(new Date()),
  sites: [],
  workers: [],
  entries: {}, // key: yyyy-mm -> array
  manualHoliday: {}, // key: yyyy-mm-dd -> true/false override
  siteSearch: "",
  quickMode: false,
  wageRate: 0,
};

async function loadAll(){
  try{
    const [workersRaw, sitesRaw, settingsRaw] = await Promise.all([
      sb("demen_workers?select=*&order=name.asc"),
      sb("demen_sites?select=*&order=sort_order.asc"),
      sb("demen_settings?select=*"),
    ]);
    state.workers = workersRaw.map(w=>({id:w.id, name:w.name, alwaysHolidayOvertime: w.always_holiday_overtime}));
    state.sites = sitesRaw.map(s=>({id:s.id, category:s.category, name:s.name, sortOrder:s.sort_order, rule:s.rule, assignedWorkers:s.assigned_workers||[]}));
    const settingsMap = {};
    (settingsRaw||[]).forEach(r=>{ settingsMap[r.key] = r.value; });
    state.manualHoliday = settingsMap.manualHoliday || {};
    state.quickMode = !!settingsMap.quickMode;
    state.wageRate = settingsMap.wageRate || 0;
  }catch(e){
    reportError("データの読み込み", e);
    state.workers = []; state.sites = []; state.manualHoliday = {}; state.quickMode = false;
  }
  await loadEntriesForMonth(ym(state.currentDate));
}
async function loadEntriesForMonth(monthKey){
  const [y,m] = monthKey.split("-").map(Number);
  const start = `${monthKey}-01`;
  const end = `${monthKey}-${pad2(new Date(y, m, 0).getDate())}`;
  try{
    const rows = await sb(`demen_entries?select=*&date=gte.${start}&date=lte.${end}&order=created_at.asc`);
    state.entries[monthKey] = rows.map(r=>({
      id:r.id, date:r.date, siteId:r.site_id, workerId:r.worker_id, workerName:r.worker_name,
      hours: r.hours!=null ? Number(r.hours) : null, night: r.night, overtime: Number(r.overtime||0),
      holidayOvertime: r.holiday_overtime, role: r.role, band: r.band
    }));
  }catch(e){
    reportError("出勤データの読み込み", e);
    state.entries[monthKey] = state.entries[monthKey] || [];
  }
}
async function saveSetting(key, value){
  try{
    await sb(`demen_settings?on_conflict=key`, { method:"POST", prefer:"resolution=merge-duplicates,return=minimal", body:[{key, value}] });
    return true;
  }catch(e){ reportError("設定の保存", e); return false; }
}

/* ===================== レンダリング ===================== */
const mainEl = document.getElementById("main");
const modalRoot = document.getElementById("modal-root");

function render(){
  if(state.tab==="entry") renderEntry();
  else if(state.tab==="report") renderReport();
  else if(state.tab==="sites") renderSites();
  else if(state.tab==="workers") renderWorkers();
}

/* ---------- 入力タブ ---------- */
function renderEntry(){
  const d = state.currentDate;
  const key = ymd(d);
  const monthKey = ym(d);
  const dayEntries = (state.entries[monthKey]||[]).filter(e=>e.date===key);
  const manualH = state.manualHoliday[key];
  const holiday = isHoliday(d, manualH);

  const bySite = {};
  dayEntries.forEach(e=>{ (bySite[e.siteId] = bySite[e.siteId]||[]).push(e); });

  const cats = [...new Set(state.sites.map(s=>s.category))];
  const q = state.siteSearch.trim();

  let html = `
    <div class="datebar">
      <button onclick="shiftDate(-1)">‹</button>
      <div class="datelabel">${d.getMonth()+1}月${d.getDate()}日<span class="dow">(${DOW[d.getDay()]})</span></div>
      <button onclick="shiftDate(1)">›</button>
    </div>
    <div class="holiday-toggle ${holiday?'on':''}" onclick="toggleHoliday()">
      ${holiday ? "🔶 休日扱い（土日祝）":"　平日扱い"}　tap で切替
    </div>
    <div class="toggle-row" style="border-top:none; padding-top:2px;">
      <span>ワンタップ入力モード（現場カードに名前が直接出る）</span>
      <label class="switch"><input type="checkbox" id="quickModeToggle" ${state.quickMode?'checked':''} onchange="toggleQuickMode()"><span class="slider"></span></label>
    </div>
    <input class="site-search" placeholder="現場名で検索..." value="${escapeAttr(state.siteSearch)}" oninput="onSearch(this.value)">
  `;

  cats.forEach(cat=>{
    const sitesInCat = state.sites.filter(s=>s.category===cat && (!q || s.name.includes(q)));
    if(sitesInCat.length===0) return;
    html += `<div class="cat-label">${cat}</div><div class="site-grid">`;
    sitesInCat.forEach(s=>{
      const doneEntries = bySite[s.id] || [];
      const done = doneEntries.length>0;
      const canQuick = state.quickMode && (s.rule.type==="fixed" || s.rule.type==="weekday" || s.rule.type==="day") && s.assignedWorkers && s.assignedWorkers.length>0;

      if(canQuick){
        const doneIds = new Set(doneEntries.map(e=>e.workerId));
        const people = s.assignedWorkers.map(id=>state.workers.find(w=>w.id===id)).filter(Boolean);
        html += `<div class="site-btn quick ${done?'done':''}" style="grid-column:1 / -1;">
          <div class="row between" onclick="openEntryModal('${s.id}')">
            <div class="name">${s.name}</div>
            <div class="meta">${ruleShortLabel(s.rule)}${done?` ・${doneEntries.length}件`:''}</div>
          </div>
          <div class="worker-list" style="margin-top:8px;">
            ${people.map(w=>`
              <span class="chip ${doneIds.has(w.id)?'on':''}" style="position:relative; padding-right:22px;" onclick="event.stopPropagation();quickToggleWorker('${s.id}','${w.id}')">
                ${w.name}
                <span onclick="event.stopPropagation();quickRemoveFromRoster('${s.id}','${w.id}')" style="position:absolute; right:5px; top:50%; transform:translateY(-50%); font-size:11px; opacity:.6;">✕</span>
              </span>`).join("")}
            <span class="chip" style="border-style:dashed;" onclick="event.stopPropagation();quickAddToRoster('${s.id}')">＋追加</span>
          </div>
        </div>`;
      } else {
        html += `<div class="site-btn ${done?'done':''}" onclick="openEntryModal('${s.id}')">
          <div class="name">${s.name}</div>
          <div class="meta">${ruleShortLabel(s.rule)}${done?` ・入力${doneEntries.length}件`:''}</div>
        </div>`;
      }
    });
    html += `</div>`;
  });

  if(dayEntries.length>0){
    html += `<div class="cat-label">この日の入力済み一覧</div><div class="card">`;
    dayEntries.forEach(e=>{
      const site = state.sites.find(s=>s.id===e.siteId);
      html += `<div class="entry-row">
        <div>
          <span class="who">${e.workerName}</span>
          <span class="detail">${site?site.name:'?'}</span>
          ${e.hours!=null?`<span class="detail">・${e.hours}H</span>`:''}
          ${e.night?`<span class="tag night">夜間</span>`:''}
          ${e.overtime?`<span class="tag ot">残業${e.overtime}H</span>`:''}
          ${e.holidayOvertime?`<span class="tag holiday">休日残業</span>`:''}
        </div>
        <div class="row" style="gap:4px;">
          <div class="remove-x" onclick="openEntryEdit('${e.id}')">✎</div>
          <div class="remove-x" onclick="removeEntry('${e.id}')">✕</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  mainEl.innerHTML = html;
}
function ruleShortLabel(rule){
  if(rule.type==="fixed") return `固定 ${rule.hours}H`;
  if(rule.type==="weekday") return `曜日別（基本${rule.defaultHours}H）`;
  if(rule.type==="bands") return `班別 ${rule.bands.map(b=>b.name+':'+b.hours+'H').join('/')}`;
  if(rule.type==="headcount") return `人数依存（単独${rule.solo.hours}H+残業/2名${rule.pair.each}H）`;
  if(rule.type==="day") return `日額（1日）`;
  return "";
}
function escapeAttr(s){ return (s||"").replace(/"/g,"&quot;"); }
window.onSearch = v => { state.siteSearch = v; renderEntry(); };
window.shiftDate = async delta => {
  const d = new Date(state.currentDate);
  d.setDate(d.getDate()+delta);
  state.currentDate = d;
  await loadEntriesForMonth(ym(d));
  renderEntry();
};
window.toggleHoliday = async () => {
  const key = ymd(state.currentDate);
  const current = isHoliday(state.currentDate, state.manualHoliday[key]);
  state.manualHoliday[key] = !current;
  renderEntry();
  await saveSetting("manualHoliday", state.manualHoliday);
};
window.toggleQuickMode = async () => {
  state.quickMode = !state.quickMode;
  renderEntry();
  await saveSetting("quickMode", state.quickMode);
};
window.quickToggleWorker = async (siteId, workerId) => {
  const site = state.sites.find(s=>s.id===siteId);
  if(!site) return;
  const d = state.currentDate;
  const dateKey = ymd(d);
  const monthKey = ym(d);
  const sunHol = isSunOrHoliday(d, state.manualHoliday[dateKey]);
  const list = state.entries[monthKey] || [];
  const existing = list.find(e=>e.siteId===siteId && e.workerId===workerId && e.date===dateKey);
  try{
    if(existing){
      await sb(`demen_entries?id=eq.${existing.id}`, {method:"DELETE", prefer:"return=minimal"});
      state.entries[monthKey] = list.filter(e=>e.id!==existing.id);
    } else {
      const w = state.workers.find(x=>x.id===workerId);
      if(!w) return;
      const rule = site.rule;
      let hours = null;
      if(rule.type==="fixed") hours = rule.hours;
      else if(rule.type==="weekday") hours = (rule.hoursByDay && rule.hoursByDay[d.getDay()]!=null) ? rule.hoursByDay[d.getDay()] : rule.defaultHours;
      const holidayOvertime = !!(w.alwaysHolidayOvertime && sunHol);
      const [row] = await sb("demen_entries", { method:"POST", body:[{
        date:dateKey, site_id:siteId, worker_id:workerId, worker_name:w.name,
        hours, night:false, overtime:0, holiday_overtime:holidayOvertime, role:null, band:null
      }]});
      state.entries[monthKey] = [...list, {
        id:row.id, date:row.date, siteId:row.site_id, workerId:row.worker_id, workerName:row.worker_name,
        hours: row.hours!=null?Number(row.hours):null, night:row.night, overtime:Number(row.overtime||0),

window.quickAddToRoster = async (siteId) => {

  if(!name || !name.trim()) return;

window.saveEntryModal = async (siteId) => {
  const site = state.sites.find(s=>s.id===siteId);
  const rule = site.rule;
  const d = state.currentDate;
  const dateKey = ymd(d);
  const monthKey = ym(d);
  const sunHol = isSunOrHoliday(d, state.manualHoliday[dateKey]);
  const newRows = [];
  const existingKeys = new Set((state.entries[monthKey]||[]).filter(e=>e.date===dateKey && e.siteId===siteId).map(e=>e.workerId));
  let skipped = 0;

  function pushEntry(workerId, hours, extra={}){
    const w = state.workers.find(x=>x.id===workerId);
    if(!w) return;
    if(existingKeys.has(workerId)){ skipped++; return; }
    existingKeys.add(workerId);
    let holidayOvertime = false;
    if(w.alwaysHolidayOvertime && sunHol) holidayOvertime = true;
    newRows.push({
      date: dateKey, site_id: siteId, worker_id: workerId, worker_name: w.name,
      hours: hours, night: !!extra.night, overtime: extra.overtime||0,
      holiday_overtime: holidayOvertime, role: extra.role||null, band: extra.band||null
    });
  }

  if(rule.type==="fixed" || rule.type==="weekday" || rule.type==="day"){
    const chips = document.querySelectorAll("#worker-chips .chip.on");
    if(chips.length===0){ alert("作業員を選択してください"); return; }
    const night = document.getElementById("nightToggle") ? document.getElementById("nightToggle").checked : false;
    const otVal = document.getElementById("overtimeInput") ? parseFloat(document.getElementById("overtimeInput").value)||0 : 0;
    const otIds = night ? new Set([...document.querySelectorAll("#ot-chips .chip.on")].map(c=>c.dataset.id)) : new Set();
    let hours = null;
    if(rule.type==="fixed") hours = rule.hours;
    else if(rule.type==="weekday") hours = (rule.hoursByDay && rule.hoursByDay[d.getDay()]!=null) ? rule.hoursByDay[d.getDay()] : rule.defaultHours;
    else if(rule.type==="day") hours = null; // 日額（時間は数えない）
    chips.forEach(c=>{
      const isOt = otIds.has(c.dataset.id);
      pushEntry(c.dataset.id, hours, {night: isOt, overtime: isOt ? otVal : 0});
    });
  } else if(rule.type==="bands"){
    let any = false;
    document.querySelectorAll("[data-band-chips]").forEach(container=>{
      const bandId = container.dataset.bandChips;
      const band = rule.bands.find(b=>b.id===bandId);
      if(!band) return;
      container.querySelectorAll(".chip.on").forEach(c=>{
        pushEntry(c.dataset.id, band.hours, {band: band.name});
        any = true;
      });
    });
    if(!any){ alert("作業員を選択してください"); return; }
  } else if(rule.type==="headcount"){
    const mode = window._modalState.hcMode;
    if(!mode){ alert("1名／2名を選択してください"); return; }
    if(mode==="solo"){
      const wid = document.getElementById("hc-solo-select").value;
      const ot = sunHol ? (rule.solo.overtimeHoliday!=null?rule.solo.overtimeHoliday:rule.solo.overtime) : rule.solo.overtime;
      pushEntry(wid, rule.solo.hours, {overtime: ot, role:"単独"});
    } else {
      const a = document.getElementById("hc-pair-a").value;
      const b = document.getElementById("hc-pair-b").value;
      pushEntry(a, rule.pair.each, {role:"早番"});
      pushEntry(b, rule.pair.each, {role:"遅番"});
    }
  }

  if(newRows.length===0){
    if(skipped>0) alert(`その${skipped}名は既にこの現場・この日で登録済みのため、スキップしました。`);
    else alert("作業員を選択してください");
    return;
  }
  try{
    const inserted = await sb("demen_entries", {method:"POST", body:newRows});
    const mapped = inserted.map(r=>({
      id:r.id, date:r.date, siteId:r.site_id, workerId:r.worker_id, workerName:r.worker_name,
      hours: r.hours!=null?Number(r.hours):null, night:r.night, overtime:Number(r.overtime||0),
      holidayOvertime:r.holiday_overtime, role:r.role, band:r.band
    }));
    state.entries[monthKey] = (state.entries[monthKey]||[]).concat(mapped);
    closeModal();
    renderEntry();
    if(skipped>0) alert(`${skipped}名は既に登録済みのためスキップしました。`);
  }catch(e){ reportError("出勤の保存", e); }
};

async function renderReport(){
  const monthKey = state.reportMonth;
  await loadEntriesForMonth(monthKey);
  const entries = state.entries[monthKey]||[];

  const [y,m] = monthKey.split("-").map(Number);
  const label = `${y}年${m}月`;
  const wage = state.wageRate || 0;

  // 作業員別集計
  const perWorker = {};
  entries.forEach(e=>{
    const key = e.workerId;
    if(!perWorker[key]) perWorker[key] = {id:key, name:e.workerName, days:new Set(), hours:0, night:0, overtime:0, holidayOt:0};
    perWorker[key].days.add(e.date);
    perWorker[key].hours += (e.hours||0);
    if(e.night) perWorker[key].night += 1;
    perWorker[key].overtime += (e.overtime||0);
    if(e.holidayOvertime) perWorker[key].holidayOt += (e.hours||0)+(e.overtime||0);
  });
  const workerRows = Object.values(perWorker).sort((a,b)=>b.days.size - a.days.size);

  // 現場別集計
  const perSite = {};
  entries.forEach(e=>{
    const site = state.sites.find(s=>s.id===e.siteId);
    const key = e.siteId;
    if(!perSite[key]) perSite[key] = {name: site?site.name:"?", days:new Set(), hours:0, overtime:0};
    perSite[key].days.add(e.date);
    perSite[key].hours += (e.hours||0);
    perSite[key].overtime += (e.overtime||0);
  });
  const siteRows = Object.values(perSite).sort((a,b)=>b.days.size - a.days.size);

  let html = `
    <div class="month-nav">
      <button onclick="shiftMonth(-1)">‹</button>
      <div class="label">${label}</div>
      <button onclick="shiftMonth(1)">›</button>
    </div>
    <div class="card">
      <div class="field" style="margin-bottom:0;">
        <label>時給（経費・給与の概算用）</label>
        <input type="number" step="10" id="wageRateInput" value="${wage||''}" placeholder="例：1000" style="width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:14px;" onchange="setWageRate(this.value)">
      </div>
    </div>
    <div class="card">
      <div class="section-title">作業員別 集計（タップで内訳）</div>
      <table class="report">
        <tr><th>氏名</th><th>出勤日数</th><th>合計時間</th><th>夜間回数</th><th>残業計</th></tr>
        ${workerRows.map(r=>`
          <tr onclick="openWorkerDetail('${r.id}')" style="cursor:pointer;">
            <td>${r.name}</td>
            <td class="summary-total">${r.days.size}日</td>
            <td>${r.hours.toFixed(1)}H</td>
            <td>${r.night}回</td>
            <td>${r.overtime.toFixed(1)}H</td>
          </tr>`).join("") || `<tr><td colspan="5" class="empty">まだ入力がありません</td></tr>`}
      </table>
    </div>
    <div class="card">
      <div class="section-title">現場別 集計</div>
      <table class="report">
        <tr><th>現場</th><th>延べ日数</th><th>合計時間</th>${wage?'<th>概算経費</th>':''}</tr>
        ${siteRows.map(r=>`
          <tr><td>${r.name}</td><td class="summary-total">${r.days.size}日</td><td>${r.hours.toFixed(1)}H</td>${wage?`<td>¥${Math.round((r.hours+r.overtime)*wage).toLocaleString()}</td>`:''}</tr>
        `).join("") || `<tr><td colspan="${wage?4:3}" class="empty">まだ入力がありません</td></tr>`}
      </table>

      「合計時間」は固定・曜日別・班別・人数依存ルールのみ集計対象です。日額現場（マンション管理など）は日数のみカウントされ、時間には含まれません。概算経費は 時給 ×（合計時間＋残業時間）の簡易計算です。

    const key = e.hours!=null ? `${e.hours}H` : "日額";

    totalHours += (e.hours||0);
    totalOvertime += (e.overtime||0);

  });
  const bucketKeys = Object.keys(bucket).sort((a,b)=>{
    if(a==="日額") return 1;
    if(b==="日額") return -1;
    return parseFloat(b)-parseFloat(a);
  });
  const estimatedPay = (totalHours + totalOvertime) * wage;

  modalRoot.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${name}</h3>
        <div class="modal-sub">${state.reportMonth} の出勤内訳</div>
        <div class="card" style="background:var(--panel2); margin-bottom:12px;">
          <div class="row" style="flex-wrap:wrap; gap:10px;">
            ${bucketKeys.map(k=>`<div><span class="summary-total">${bucket[k]}</span>日 <span style="color:var(--sub); font-size:12px;">（${k}）</span></div>`).join("")}
          </div>
          <div style="margin-top:10px; border-top:1px solid var(--line); padding-top:10px;">
            <div>合計出勤日数：<b>${entries.length}日</b></div>
            <div>合計時間：<b>${totalHours.toFixed(1)}H</b>　残業計：<b>${totalOvertime.toFixed(1)}H</b>　夜間：<b>${nightCount}回</b></div>
            ${wage ? `<div style="margin-top:6px; color:var(--accent); font-weight:700;">概算給与：¥${Math.round(estimatedPay).toLocaleString()}</div>` : ''}
          </div>
        </div>
        <div class="section-title" style="font-size:14px;">明細</div>
        ${entries.map(e=>{
          const site = state.sites.find(s=>s.id===e.siteId);
          return `<div class="entry-row">
            <div>
              <span class="who">${e.date.slice(5)}</span>
              <span class="detail">${site?site.name:'?'}</span>
              ${e.hours!=null?`<span class="detail">・${e.hours}H</span>`:''}
              ${e.night?`<span class="tag night">夜間</span>`:''}
              ${e.overtime?`<span class="tag ot">残業${e.overtime}H</span>`:''}
              ${e.holidayOvertime?`<span class="tag holiday">休日残業</span>`:''}
            </div>
            <div class="remove-x" onclick="openEntryEdit('${e.id}')">✎</div>
          </div>`;
        }).join("")}
        <div class="btnbar">
          <button class="btn ghost" onclick="closeModal()">閉じる</button>
        </div>
      </div>
    </div>
  `;
};
window.shiftMonth = async (delta) => {
  const [y,m] = state.reportMonth.split("-").map(Number);
  const d = new Date(y, m-1+delta, 1);
  state.reportMonth = ym(d);
  await loadEntriesForMonth(state.reportMonth);
  renderReport();
};

/* ---------- 現場設定タブ ---------- */
function renderSites(){
  const cats = [...new Set(state.sites.map(s=>s.category))];
  let html = `
    <div class="card">
      <div class="section-title">新しい現場を追加</div>
      <form class="inline" onsubmit="return addSite(event)">
        <input id="newSiteName" placeholder="現場名">
        <select class="plain" id="newSiteCategory">
          ${cats.map(c=>`<option>${c}</option>`).join("")}
          <option value="__new__">＋新しいカテゴリ</option>
        </select>
        <select class="plain" id="newSiteRuleType">
          <option value="fixed">固定時間</option>
          <option value="day">日額（1日）</option>
          <option value="bands">班別固定</option>
          <option value="headcount">人数依存</option>
        </select>
      </form>
      <div class="footer-note" style="margin-top:-6px;">複雑なルール（曜日別・班別の細かい時間・残業計算式）は追加後に一覧の「編集」から詳細設定できます。</div>
    </div>
  `;
  cats.forEach(cat=>{
    html += `<div class="cat-label">${cat}</div>`;
    const sitesInCat = state.sites.filter(s=>s.category===cat);
    sitesInCat.forEach((s, idx)=>{
      const assignedNames = (s.assignedWorkers||[]).map(id=>{const w=state.workers.find(x=>x.id===id); return w?w.name:null;}).filter(Boolean);
      html += `<div class="site-config-row">
        <div class="top">
          <strong>${s.name}</strong>
          <div class="row" style="gap:10px;">
            <button class="link-btn" onclick="moveSite('${s.id}',-1)" ${idx===0?'disabled style="opacity:.3;"':''}>▲</button>
            <button class="link-btn" onclick="moveSite('${s.id}',1)" ${idx===sitesInCat.length-1?'disabled style="opacity:.3;"':''}>▼</button>
            <button class="link-btn" onclick="openSiteEdit('${s.id}')">編集</button>
            <button class="link-btn" style="color:var(--warn);" onclick="deleteSite('${s.id}')">削除</button>
          </div>
        </div>
        <div class="rule-desc">${ruleShortLabel(s.rule)}</div>
        ${assignedNames.length ? `<div class="rule-desc">担当：${assignedNames.join("・")}</div>` : ""}
      </div>`;
    });
  });
  mainEl.innerHTML = html;
}
window.moveSite = async (siteId, dir) => {
  const site = state.sites.find(s=>s.id===siteId);
  if(!site) return;
  const sameCat = state.sites.filter(s=>s.category===site.category);
  const idx = sameCat.findIndex(s=>s.id===siteId);
  const swapWith = sameCat[idx+dir];
  if(!swapWith) return;
  const globalIdxA = state.sites.findIndex(s=>s.id===site.id);
  const globalIdxB = state.sites.findIndex(s=>s.id===swapWith.id);
  const sortA = state.sites[globalIdxA].sortOrder;
  const sortB = state.sites[globalIdxB].sortOrder;
  [state.sites[globalIdxA], state.sites[globalIdxB]] = [state.sites[globalIdxB], state.sites[globalIdxA]];
  state.sites[globalIdxA].sortOrder = sortA;
  state.sites[globalIdxB].sortOrder = sortB;
  renderSites();
  try{
    await Promise.all([
      sb(`demen_sites?id=eq.${site.id}`, {method:"PATCH", prefer:"return=minimal", body:{sort_order: sortB}}),
      sb(`demen_sites?id=eq.${swapWith.id}`, {method:"PATCH", prefer:"return=minimal", body:{sort_order: sortA}}),
    ]);
  }catch(e){ reportError("並び替えの保存", e); }
};
const WEEKDAY_LABELS = ["日","月","火","水","木","金","土"];
function renderRuleEditor(rule){
  if(rule.type==="fixed"){
    return `
      <div class="field">
        <label>勤務時間（H）</label>
        <input type="number" step="0.5" id="edit-rule-hours" value="${rule.hours}" style="width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:14px;">
      </div>
    `;
  }
  if(rule.type==="day"){
    return `<div class="footer-note" style="margin:0 0 10px;">日額現場のため時間の設定はありません（出勤日数のみ数えます）。</div>`;
  }
  if(rule.type==="weekday"){
    return `
      <div class="field">
        <label>基本時間（H）</label>
        <input type="number" step="0.5" id="edit-rule-default" value="${rule.defaultHours}" style="width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:14px; margin-bottom:10px;">
      </div>
      <div class="field">
        <label>曜日ごとの例外（空欄なら基本時間を使用）</label>
        <div class="row" style="gap:6px; flex-wrap:wrap;">
          ${WEEKDAY_LABELS.map((lbl,i)=>`
            <div style="text-align:center;">
              <div style="font-size:11px; color:var(--sub); margin-bottom:3px;">${lbl}</div>
              <input type="number" step="0.5" data-weekday="${i}" value="${rule.hoursByDay && rule.hoursByDay[i]!=null ? rule.hoursByDay[i] : ''}" style="width:52px; padding:7px 4px; text-align:center; border-radius:7px; border:1px solid var(--line); background:var(--panel2); color:var(--text);">
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }
  if(rule.type==="bands"){
    return `
      <div class="field">
        <label>班ごとの時間（H）</label>
        ${rule.bands.map(b=>`
          <div class="row" style="gap:8px; margin-bottom:8px;">
            <span style="width:60px;">${b.name}班</span>
            <input type="number" step="0.5" data-band-hours="${b.id}" value="${b.hours}" style="flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text);">
          </div>
        `).join("")}
      </div>
    `;
  }
  if(rule.type==="headcount"){
    return `
      <div class="field">
        <label>1名の時（本務時間・残業時間）</label>
        <div class="row" style="gap:8px;">
          <input type="number" step="0.5" id="edit-hc-solo-hours" value="${rule.solo.hours}" placeholder="本務H" style="flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text);">
          <input type="number" step="0.5" id="edit-hc-solo-ot" value="${rule.solo.overtime}" placeholder="残業H" style="flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text);">
        </div>
        <label style="margin-top:8px;">土日祝の残業時間（空欄なら上と同じ）</label>
        <input type="number" step="0.5" id="edit-hc-solo-ot-holiday" value="${rule.solo.overtimeHoliday!=null?rule.solo.overtimeHoliday:''}" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text);">
      </div>
      <div class="field">
        <label>2名の時（それぞれの時間）</label>
        <input type="number" step="0.5" id="edit-hc-pair-each" value="${rule.pair.each}" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text);">
      </div>
    `;
  }
  return "";
}
function readRuleEditor(originalRule){
  const rule = JSON.parse(JSON.stringify(originalRule));
  if(rule.type==="fixed"){
    rule.hours = parseFloat(document.getElementById("edit-rule-hours").value) || 0;
  } else if(rule.type==="weekday"){
    rule.defaultHours = parseFloat(document.getElementById("edit-rule-default").value) || 0;
    const hoursByDay = {};
    document.querySelectorAll("[data-weekday]").forEach(inp=>{
      if(inp.value !== "") hoursByDay[inp.dataset.weekday] = parseFloat(inp.value);
    });
    rule.hoursByDay = hoursByDay;
  } else if(rule.type==="bands"){
    document.querySelectorAll("[data-band-hours]").forEach(inp=>{
      const band = rule.bands.find(b=>b.id===inp.dataset.bandHours);
      if(band) band.hours = parseFloat(inp.value) || 0;
    });
  } else if(rule.type==="headcount"){
    rule.solo.hours = parseFloat(document.getElementById("edit-hc-solo-hours").value) || 0;
    rule.solo.overtime = parseFloat(document.getElementById("edit-hc-solo-ot").value) || 0;
    const holidayVal = document.getElementById("edit-hc-solo-ot-holiday").value;
    if(holidayVal !== "") rule.solo.overtimeHoliday = parseFloat(holidayVal);
    else delete rule.solo.overtimeHoliday;
    rule.pair.each = parseFloat(document.getElementById("edit-hc-pair-each").value) || 0;
  }
  return rule;
}
window.openSiteEdit = (siteId) => {
  const site = state.sites.find(s=>s.id===siteId);
  if(!site) return;
  const assigned = new Set(site.assignedWorkers||[]);
  modalRoot.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>現場を編集</h3>
        <div class="modal-sub">${site.category}</div>
        <div class="field">
          <label>現場名</label>
          <input type="text" id="editSiteName" value="${escapeAttr(site.name)}" style="width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:14px;">
        </div>
        ${renderRuleEditor(site.rule)}
        <div class="field">
          <label>担当作業員（タップでON/OFF・空にすると全員から選択できます）</label>
          <div class="worker-list" id="edit-worker-chips">
            ${state.workers.map(w=>`<span class="chip ${assigned.has(w.id)?'on':''}" data-id="${w.id}" onclick="toggleChip(this)">${w.name}</span>`).join("")}
          </div>
        </div>
        <div class="btnbar">
          <button class="btn ghost" onclick="closeModal()">キャンセル</button>
          <button class="btn primary" onclick="saveSiteEdit('${siteId}')">保存する</button>
        </div>
      </div>
    </div>
  `;
};
window.saveSiteEdit = async (siteId) => {
  const site = state.sites.find(s=>s.id===siteId);
  if(!site) return;
  const name = document.getElementById("editSiteName").value.trim();
  const chosen = [...document.querySelectorAll("#edit-worker-chips .chip.on")].map(c=>c.dataset.id);
  const rule = readRuleEditor(site.rule);
  try{
    const body = { assigned_workers: chosen, rule };
    if(name) body.name = name;
    await sb(`demen_sites?id=eq.${siteId}`, {method:"PATCH", prefer:"return=minimal", body});
    if(name) site.name = name;
    site.assignedWorkers = chosen;
    site.rule = rule;
    closeModal();
    renderSites();
  }catch(e){ reportError("現場の更新", e); }
};
window.addSite = async (ev) => {
  ev.preventDefault();
  const name = document.getElementById("newSiteName").value.trim();
  if(!name) return false;
  let category = document.getElementById("newSiteCategory").value;
  if(category === "__new__"){
    category = prompt("新しいカテゴリ名") || "その他";
  }
  const ruleType = document.getElementById("newSiteRuleType").value;
  let rule;
  if(ruleType==="fixed"){
    const h = parseFloat(prompt("固定時間（H）を入力", "8")) || 8;
    rule = {type:"fixed", hours:h};
  } else if(ruleType==="day"){
    rule = {type:"day"};
  } else if(ruleType==="bands"){
    rule = {type:"bands", bands:[{id:"A",name:"A",hours:8},{id:"B",name:"B",hours:4}]};
  } else if(ruleType==="headcount"){
    rule = {type:"headcount", solo:{hours:8, overtime:3.5}, pair:{each:6, label:"早番/遅番"}};
  }
  const maxSort = state.sites.reduce((m,s)=>Math.max(m, s.sortOrder||0), 0);
  try{
    const [row] = await sb("demen_sites", {method:"POST", body:[{category, name, rule, sort_order: maxSort+1, assigned_workers: []}]});
    state.sites.push({id:row.id, category:row.category, name:row.name, sortOrder:row.sort_order, rule:row.rule, assignedWorkers:row.assigned_workers||[]});
    renderSites();
  }catch(e){ reportError("現場の追加", e); }
  return false;
};
window.deleteSite = async (id) => {
  if(!confirm("この現場を削除しますか？（過去の入力データは残ります）")) return;
  try{
    await sb(`demen_sites?id=eq.${id}`, {method:"DELETE", prefer:"return=minimal"});
    state.sites = state.sites.filter(s=>s.id!==id);
    renderSites();
  }catch(e){ reportError("現場の削除", e); }
};

/* ---------- 作業員タブ ---------- */
function renderWorkers(){
  let html = `
    <div class="card">
      <div class="section-title">作業員を追加</div>
      <form class="inline" onsubmit="return addWorker(event)">
        <input id="newWorkerName" placeholder="氏名">
        <button class="btn primary" style="flex:0 0 auto; padding:9px 16px;">追加</button>
      </form>
    </div>
    <div class="cat-label">作業員一覧（${state.workers.length}名）</div>
  `;
  state.workers.forEach(w=>{
    html += `<div class="worker-master-row">
      <div>
        <div>${w.name}</div>
        <div class="small-flag">${w.alwaysHolidayOvertime?'土日祝は常に残業扱い ✓':''}</div>
      </div>
      <div class="flags">
        <button class="link-btn" onclick="toggleHolidayFlag('${w.id}')">${w.alwaysHolidayOvertime?'解除':'土日祝は残業扱いにする'}</button>
        <button class="link-btn" style="color:var(--warn);" onclick="deleteWorker('${w.id}')">削除</button>
      </div>
    </div>`;
  });
  html += `<div class="footer-note">「土日祝は常に残業扱い」は、吉原さんのように現場のルールに関わらず個人単位で土日祝の勤務が全部残業になる人向けの設定です。</div>`;
  mainEl.innerHTML = html;
}
window.addWorker = async (ev) => {
  ev.preventDefault();
  const name = document.getElementById("newWorkerName").value.trim();
  if(!name) return false;
  try{
    const [row] = await sb("demen_workers", {method:"POST", body:[{name, always_holiday_overtime:false}]});
    state.workers.push({id:row.id, name:row.name, alwaysHolidayOvertime:row.always_holiday_overtime});
    renderWorkers();
  }catch(e){ reportError("作業員の追加", e); }
  return false;
};
window.toggleHolidayFlag = async (id) => {
  const w = state.workers.find(x=>x.id===id);
  if(!w) return;
  const next = !w.alwaysHolidayOvertime;
  try{
    await sb(`demen_workers?id=eq.${id}`, {method:"PATCH", prefer:"return=minimal", body:{always_holiday_overtime: next}});
    w.alwaysHolidayOvertime = next;
    renderWorkers();
  }catch(e){ reportError("設定の更新", e); }
};
window.deleteWorker = async (id) => {
  if(!confirm("この作業員を削除しますか？")) return;
  try{
    await sb(`demen_workers?id=eq.${id}`, {method:"DELETE", prefer:"return=minimal"});
    state.workers = state.workers.filter(w=>w.id!==id);
    renderWorkers();
  }catch(e){ reportError("作業員の削除", e); }
};

/* ===================== タブ切替 & 初期化 ===================== */
document.querySelectorAll("nav button").forEach(btn=>{
  btn.addEventListener("click", async ()=>{
    document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.tab = btn.dataset.tab;
    if(state.tab==="entry") await loadEntriesForMonth(ym(state.currentDate));
    render();
  });
});

(async function init(){
  mainEl.innerHTML = `<div class="empty">読み込み中...</div>`;
  await loadAll();
  render();
})();
</script>
